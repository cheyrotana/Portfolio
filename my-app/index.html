<!doctype html>
<html lang="en" data-theme="metro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chey Rotana | Mobile &amp; Full-Stack Developer</title>
    <meta
      name="description"
      content="Chey Rotana — mobile and full-stack developer in Phnom Penh building government HR, attendance and community platforms with Flutter, Angular and NestJS."
    />
    <meta name="author" content="Chey Rotana" />
    <meta
      name="keywords"
      content="Chey Rotana, Rotana Chey, portfolio, Flutter developer, Angular, NestJS, mobile developer, full-stack developer, Phnom Penh, Cambodia, CADT"
    />
    <meta name="theme-color" content="#f06a1f" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://cheyrotana-portfolio-v1.vercel.app/" />

    <!-- Icons -->
    <!-- one icon that follows the theme (set below and in theme.ts) -->
    <link id="theme-icon" rel="icon" href="/favicon-metro.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Facebook, Telegram, LinkedIn, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chey Rotana" />
    <meta property="og:url" content="https://cheyrotana-portfolio-v1.vercel.app/" />
    <meta property="og:title" content="Chey Rotana | Mobile & Full-Stack Developer" />
    <meta
      property="og:description"
      content="Flutter apps, Angular dashboards and the NestJS APIs behind them — from Phnom Penh, Cambodia."
    />
    <meta property="og:image" content="https://cheyrotana-portfolio-v1.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chey Rotana — Mobile & Full-Stack Developer" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chey Rotana | Mobile & Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Flutter apps, Angular dashboards and the NestJS APIs behind them — from Phnom Penh, Cambodia."
    />
    <meta name="twitter:image" content="https://cheyrotana-portfolio-v1.vercel.app/og-image.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Chey Rotana",
        "url": "https://cheyrotana-portfolio-v1.vercel.app/",
        "image": "https://cheyrotana-portfolio-v1.vercel.app/og-image.png",
        "jobTitle": "Mobile & Full-Stack Developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Phnom Penh", "addressCountry": "KH" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Cambodia Academy of Digital Technology" },
        "knowsAbout": ["Flutter", "Dart", "Angular", "TypeScript", "NestJS", "PostgreSQL", "React"],
        "sameAs": ["https://github.com/cheyrotana", "https://www.linkedin.com/in/rotana-chey-92b572396/"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DotGothic16&family=Overpass:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@900&display=swap"
    />

    <!-- Apply the saved theme before first paint so the page never flashes the wrong one, with its
         favicon and browser colour. First-time visitors get the Metro theme. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch (e) {}
        if (theme === "editorial") theme = "metro"; // Editorial was replaced by Metro
        if (["persona", "metro", "pop"].indexOf(theme) === -1) theme = "metro";
        document.documentElement.setAttribute("data-theme", theme);
        var icons = { persona: ["/favicon-32.png", "image/png", "#e60012"], metro: ["/favicon-metro.svg", "image/svg+xml", "#f06a1f"], pop: ["/favicon-pop.svg", "image/svg+xml", "#ff5a36"] };
        var icon = document.getElementById("theme-icon");
        icon.href = icons[theme][0];
        icon.type = icons[theme][1];
        document.querySelector('meta[name="theme-color"]').content = icons[theme][2];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
