    />

    <!-- Retro, while the app loads (data-boot, set below; RetroGateway clears it once the opening is up): the
         screen is the dark room with its loading still, not the cream page under everything -->
    <style>
      html[data-boot] {
        background-color: #0d0805;
        /* the opening's darker corners (.retro-room.is-hero::after in opening.css) over the still */
        background-image:
          radial-gradient(ellipse 75% 70% at 62% 45%, transparent 40%, rgb(10 5 2 / 0.55) 100%),
          var(--boot-still, none);
        background-repeat: no-repeat;
        /* (100vh, not 100%: the page is still empty, so <html> has no height yet) */
        background-size: 100vw 100vh, auto 100vh;
        background-position: 0 0, var(--boot-x, center) 0;
      }
      html[data-boot] body {
        background: transparent;
      }
    </style>

    <!-- Apply the saved theme before first paint so the page never flashes the wrong one, with its
         favicon and browser colour. First-time visitors get the Retro theme. -->
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch (e) {}
        if (theme === "editorial") theme = "metro"; // Editorial was replaced by Metro
        if (["persona", "metro", "retro"].indexOf(theme) === -1) theme = "retro"; // Pop was removed: its fans get Retro
        document.documentElement.setAttribute("data-theme", theme);
        var icons = { persona: ["/favicon-32.png", "image/png", "#e60012"], metro: ["/favicon-metro.svg", "image/svg+xml", "#f06a1f"], retro: ["/favicon-retro.svg", "image/svg+xml", "#a8431b"] };
        var icon = document.getElementById("theme-icon");
        icon.href = icons[theme][0];
        icon.type = icons[theme][1];
        document.querySelector('meta[name="theme-color"]').content = icons[theme][2];
        // Retro: fetch the room's loading still now, so it's there at first paint (not popping in after the app mounts).
        // A reload (or back/forward) of a page that was scrolled past the opening comes back with the opening already
        // open (RetroGateway saves that on pagehide): the browser puts the scroll back only at load, so the page
        // says so now, and the still is the open room instead of the close-up (no zoomed-in flash first).
        if (theme === "retro") {
          var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
          var back = nav && (nav.type === "reload" || nav.type === "back_forward");
          var wasOpen = false;
          try {
            wasOpen = back && sessionStorage.getItem("retro-open") === "1";
          } catch (e) {}
          if (wasOpen || location.hash.length > 1) document.documentElement.setAttribute("data-gate-resume", "");
          // otherwise the page opens on the opening: mark it now (RetroGateway keeps it up to date), so what hides
          // while it shows (the wavy seam under it) is hidden from the first paint instead of fading out after it
          else document.documentElement.setAttribute("data-gate", "in");
          var still = document.createElement("link");
          still.rel = "preload";
          still.as = "image";
          still.href = document.documentElement.hasAttribute("data-gate-resume") ? "/textures/room-still-open.webp" : "/textures/room-still.webp";
          still.setAttribute("fetchpriority", "high");
          document.head.appendChild(still);
          // until the opening is up, the screen shows that still (the style above), placed the way RetroRoom
          // places it (its STILL_AXIS: the stills are 2340 × 1083, the camera's centre at (0.5 + shift) of
          // the width). Squarer screens have no still: just the dark room colour.
          var root = document.documentElement;
          root.setAttribute("data-boot", "");
          var w = window.innerWidth;
          var h = window.innerHeight;
          if (w / h > 4 / 3) {
            var open = root.hasAttribute("data-gate-resume");
            var x = open ? 0.5 * w - ((0.5 * 2340) / 1083) * h : (w >= 1024 ? 0.66 : 0.5) * w - ((0.66 * 2340) / 1083) * h;
            root.style.setProperty("--boot-still", 'url("' + still.href + '")');
            root.style.setProperty("--boot-x", x + "px");
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
